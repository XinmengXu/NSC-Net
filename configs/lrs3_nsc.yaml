# Network config
audionet:
  audionet_name: NSCNet
  audionet_config:
    out_channels: 128
    in_channels: 512
    vpre_channels: 512
    vin_channels: 64
    vout_channels: 64
    num_blocks: 16
    upsampling_depth: 5
    enc_kernel_size: 1 # ms
    num_sources: 1

videonet:
  videonet_name: ResNetVideoModel
  videonet_config:
    pretrain: .pth.tar

# Loss config
loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_snr
    config:
      pit_from: pw_mtx
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false

# Training config
training:
  system: AudioVisualLightningModule
  gpus: [0,1,2,3,4,5,6,7]
  parallel: auto
  seed: 2026
  gradient_clip_val: 5.0
  gradient_clip_algorithm: norm
  precision: 32-true
  deterministic: false
  epochs: 250
  early_stop:
    monitor: val_loss/dataloader_idx_0
    mode: min
    patience: 20
    verbose: true
  
# Optim config
optimizer:
  optim_name: AdamW
  lr: 0.00005
  weight_decay: 0.0001

# Sche config
scheduler: 
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 8
    factor: 0.5
    min_lr: 0.000001

# Data config
datamodule:
  data_name: AVSpeechDyanmicDataModule
  data_config:
    train_dir: data_preprocess/LRS3/tr
    valid_dir: data_preprocess/LRS3/cv
    test_dir: data_preprocess/LRS3/tt
    n_src: 1
    sample_rate: 16000
    segment: 2.0
    normalize_audio: false
    batch_size: 64
    num_workers: 24
    pin_memory: true
    persistent_workers: true
  
exp:
  exp_name: LRS3-NSCNet

main_args: {}
